name: Deploy Pages

on:
  push:
    branches: ["claude/fix-apk-download-1PwlI"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          # Auto-enable Pages with the GitHub Actions source if not already set up.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          # Publish the repo root: the Meetus page stays at /, SocialShield at /shield/.
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
