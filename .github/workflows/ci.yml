name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  shield:
    name: SocialShield checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Syntax-check all scripts
        run: |
          for f in shield/js/*.js shield/tests/*.js; do
            node --check "$f"
          done

      - name: Run logic tests
        run: node --test "shield/tests/*.test.js"
