# DeenVault AI Agents — Railway Configuration
# Deploy two services: one for NG region, one for EG region.
# Each service gets its own Railway project with region-specific env vars.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 10
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
